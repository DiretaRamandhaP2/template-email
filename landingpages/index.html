<!doctype html>
<html lang="en" data-reset-endpoint="">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Luma password">
  <title>Reset Your Password · Luma</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page-shell">
    <section class="reset-card" aria-labelledby="page-title">
      <a class="brand" href="/" aria-label="Luma home"><span class="brand-mark" aria-hidden="true">✦</span> Luma</a>
      <div class="intro">
        <div class="icon" aria-hidden="true">↻</div>
        <h1 id="page-title">Reset Your Password</h1>
        <p>Choose a new password for your Luma account.</p>
      </div>
      <div class="alert" id="alert" role="alert" aria-live="polite" hidden></div>
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">New password</label>
          <div class="input-wrap">
            <input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12"
              required>
            <button class="password-toggle" type="button" data-target="new-password"
              aria-label="Show new password">Show</button>
          </div>
          <small>Use at least 12 characters.</small>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <div class="input-wrap">
            <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password"
              minlength="12" required>
            <button class="password-toggle" type="button" data-target="confirm-password"
              aria-label="Show password confirmation">Show</button>
          </div>
        </div>
        <button class="submit-button" id="submit-button" type="submit">Update Password</button>
        </form>
      <p class="login-link"><a href="/login">Return to login</a></p>
      <p class="security-note">For your security, this link can only be used once and expires after 30 minutes.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
